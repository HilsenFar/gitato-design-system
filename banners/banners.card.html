<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-hub); padding: 14px; }
  .g { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .g img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; border: 1px solid rgba(140,150,255,.16); display: block; }
  a { color: #8b90b3; }
  a:hover { color: #eef0ff; }
</style>
</head>
<body>
  <div class="g">
    <img src="../assets/hub/gitato-game-cover.png" alt="GITATO the game">
    <img src="../assets/hub/sprunkiverse-cover.png" alt="Jason's Sprunkiverse">
    <img src="../assets/hub/banners/beatsurfer-cover.png" alt="BeatSurfer">
    <img src="../assets/hub/banners/frequencypilot-cover.png" alt="FrequencyPilot">
    <img src="../assets/hub/banners/addson-cover.png" alt="AddSon">
    <img src="../assets/hub/banners/mediestudio-cover.png" alt="MedieStudio">
  </div>
</body>
</html>
