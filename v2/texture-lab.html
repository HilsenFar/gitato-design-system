<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GITATO texture lab</title>
<style>
  :root{ --bg:#05060d; --panel:rgba(12,14,28,.7); --line:rgba(140,150,255,.16);
         --ink:#eef0ff; --dim:#8b90b3; --violet:#7c6cff; }
  *{box-sizing:border-box}
  body{ margin:0; padding:28px; background:var(--bg); color:var(--ink);
        font:13px/1.5 "Segoe UI",system-ui,sans-serif; }
  h1{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 20px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
  .swatch{position:relative;height:210px;border-radius:14px;overflow:hidden;
          border:1px solid var(--line);
          background:
            radial-gradient(900px 500px at 70% -20%, rgba(124,108,255,.20), transparent 62%),
            radial-gradient(700px 460px at 8% 115%, rgba(255,77,109,.13), transparent 60%),
            #06070f;}
  .swatch b{position:absolute;left:14px;bottom:12px;z-index:5;font-size:10.5px;
            letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .swatch i{position:absolute;left:14px;top:14px;z-index:5;font-style:normal;font-size:26px;
            font-weight:900;letter-spacing:.06em;color:#fff;opacity:.92}
  .fx{position:absolute;inset:0;pointer-events:none}

  /* A — feTurbulence film grain, baked to a data URI. One decode, tiles forever. */
  .grain-svg{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity:.09; mix-blend-mode:overlay;
  }
  /* B — same grain, screen blend (lifts blacks instead of hardening them) */
  .grain-screen{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity:.055; mix-blend-mode:screen;
  }
  /* C — pure CSS dither: two offset dot grids, no image decode at all */
  .dither{
    background-image:
      radial-gradient(rgba(255,255,255,.35) .5px, transparent .5px),
      radial-gradient(rgba(255,255,255,.22) .5px, transparent .5px);
    background-size:3px 3px, 3px 3px;
    background-position:0 0, 1.5px 1.5px;
    opacity:.16; mix-blend-mode:soft-light;
  }
  /* D — scanlines, gated so they never touch text (behind content, low alpha) */
  .scan{
    background-image:repeating-linear-gradient(0deg,
      rgba(0,0,0,.42) 0 1px, transparent 1px 3px);
    opacity:.32;
  }
  /* E — anisotropic brushed metal. 0deg = HORIZONTAL streaks (90deg gave vertical
         banding, which read as a rendering artefact rather than a material). */
  .brushed{
    background-image:
      repeating-linear-gradient(0deg,
        rgba(255,255,255,.022) 0 1px, transparent 1px 2px,
        rgba(0,0,0,.022) 2px 3px, transparent 3px 6px),
      linear-gradient(104deg, transparent 34%, rgba(180,190,255,.05) 50%, transparent 66%);
    opacity:.7; mix-blend-mode:overlay;
  }
  /* F — ship stack, corrected. The grain MUST carry a blend mode; without one it
         paints flat grey over the page and kills the black (see the first pass).
         Vignette is a separate, unblended layer so it darkens rather than hazes. */
  .ship{
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.5'/></svg>");
    background-size:140px 140px;
    opacity:.10; mix-blend-mode:overlay;
  }
  .ship-vig{
    background:radial-gradient(125% 95% at 50% 30%, transparent 46%, rgba(2,3,8,.55) 100%);
  }
</style>
</head>
<body>
<h1>Texture candidates — same base, six overlays</h1>
<div class="row">
  <div class="swatch"><i>Aa</i><div class="fx grain-svg"></div><b>A · grain / overlay .09</b></div>
  <div class="swatch"><i>Aa</i><div class="fx grain-screen"></div><b>B · grain / screen .055</b></div>
  <div class="swatch"><i>Aa</i><div class="fx dither"></div><b>C · css dither / soft-light</b></div>
</div>
<div class="row">
  <div class="swatch"><i>Aa</i><div class="fx scan"></div><b>D · scanlines .32</b></div>
  <div class="swatch"><i>Aa</i><div class="fx brushed"></div><b>E · brushed metal (0deg)</b></div>
  <div class="swatch"><i>Aa</i><div class="fx ship-vig"></div><div class="fx ship"></div><b>F · ship stack, corrected</b></div>
</div>
<div class="row">
  <div class="swatch" style="background:#06070f"><i>Aa</i><b>G · no texture (control)</b></div>
  <div class="swatch"><i>Aa</i><b>H · gradient only (control)</b></div>
  <div class="swatch"><i>Aa</i><div class="fx ship-vig"></div><div class="fx ship"></div><div class="fx brushed" style="opacity:.45"></div><b>I · ship + brushed</b></div>
</div>
</body>
</html>
